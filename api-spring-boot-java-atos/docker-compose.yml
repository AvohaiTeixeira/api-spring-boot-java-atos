services:
  # Serviço do Banco de Dados
  db-mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      - MYSQL_DATABASE=mysql_db
      - MYSQL_USER=mysql_user
      - MYSQL_PASSWORD=mysql_password
      - MYSQL_ROOT_PASSWORD=root_password
    ports:
      - "3307:3306" # Mapeia a 3307 da máquina para a 3306 padrão do container
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Minha Aplicação Spring Boot
  api-atos:
    image: avohaiteixeira/api-spring-boot-java-atos:0.0.3-SNAPSHOT
    container_name: api-spring-boot-java
    ports:
      - "8081:8081"
    volumes:
      - ./mysql_data:/var/lib/mysql
    depends_on:
      db-mysql:
        condition: service_healthy # Só sobe a API quando o banco estiver pronto
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/mysql_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=mysql_user
      - SPRING_DATASOURCE_PASSWORD=mysql_password
      - SPRING_FLYWAY_REPAIR_ON_MIGRATE=true
      - LOGGING_LEVEL_BR_COM_ATOS=DEBUG